http:
  middlewares:
    my-easy-traefik-rate-limit-jwt:
      plugin:
        easy-traefik-rate-limit-jwt:
          Alg: HS256
          ErrorMessage: "Authentication failed."
          ExpirationMessage: "Your session has expired. Please log in again."
          JwtPayloadFields:
            - exp
            - sub
            - iat
          RoutesToBypassJwtValidation:
            - match: PathPrefix(`/api/v1/auth`)
          RoutesToBypassTokenExpiration:
            - match: PathPrefix(`/api/v1/auth`)
          Secret:
            - asd
          Sources:
            - key: Authorization
              type: bearer
          InjectNewHeaders:
            X-User-ID:
              From:
                - JwtPayloadFields
              Values:
                - sub
          logs:
            level: DEBUG
    x-api-key:
      headers:
        customRequestHeaders:
          x-api-key: 1
    cors:
      headers:
        accessControlAllowMethods:
          - "*"
        accessControlAllowOriginList:
          - "*"
        accessControlAllowHeaders:
          - "*"
        accessControlMaxAge: 100
        addVaryHeader: true
